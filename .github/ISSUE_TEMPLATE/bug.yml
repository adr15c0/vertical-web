name: Bug
description: Something is broken or behaves incorrectly.
title: "fix: <short description>"
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs. actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Local (DDEV) / staging / Azure prod; Divi version; browser.
    validations:
      required: false
