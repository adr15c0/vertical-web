name: Spike / research
description: A time-boxed investigation to answer an open question.
title: "spike: <question to answer>"
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome / deliverable
      description: A decision memo, prototype, or documented finding.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: e.g., 1 day
    validations:
      required: false
