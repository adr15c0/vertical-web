name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo hygiene & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required files present
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CONTRIBUTING.md
            SECURITY.md
            .gitignore
            .editorconfig
            .github/CODEOWNERS
            docs/plan/00-overview.md
            docs/plan/backlog.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then echo "::error::missing required file: $f"; missing=1; fi
          done
          exit $missing

      - name: Validate JSON files parse
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          fail=0
          for f in **/*.json; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "::error file=$f::invalid JSON"; fail=1
            fi
          done
          exit $fail

      - name: No obvious secrets committed
        run: |
          set -euo pipefail
          if grep -RInE -- '-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----' \
               --exclude-dir=.git . ; then
            echo "::error::private key material detected"; exit 1
          fi
          echo "ok"

  # Detect which areas changed so the heavier jobs only run when relevant.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.filter.outputs.php }}
      console: ${{ steps.filter.outputs.console }}
      divi: ${{ steps.filter.outputs.divi }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            php:
              - 'child-theme/**/*.php'
              - 'mu-plugins/**/*.php'
              - 'phpcs.xml.dist'
            console:
              - 'console/**'
            divi:
              - 'asset-pipeline/**/*.json'
              - 'asset-pipeline/schema/**'
              - 'scripts/ci/validate_divi_json.py'

  php-lint:
    name: PHPCS (WordPress standards)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Count project PHP files
        id: php
        run: |
          set -euo pipefail
          count=$(find child-theme mu-plugins -name '*.php' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "PHP files to lint: $count"

      - name: Set up PHP + PHPCS
        if: steps.php.outputs.count != '0'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr
          coverage: none

      - name: Install WordPress Coding Standards
        if: steps.php.outputs.count != '0'
        run: |
          set -euo pipefail
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer \
            wp-coding-standards/wpcs \
            phpcompatibility/phpcompatibility-wp \
            dealerdirect/phpcodesniffer-composer-installer
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"

      - name: Run PHPCS
        if: steps.php.outputs.count != '0'
        run: phpcs -q --report=checkstyle | cs2pr

  console-lint-test:
    name: Console lint & build
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- Python BFF (console/api): lint + compile ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ruff lint + compile (console/api)
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff
          ruff check console/api
          python -m compileall -q console/api

      # --- React front-end (console/web): build ---
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build (console/web)
        working-directory: console/web
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build

  divi-asset-schema:
    name: Divi Library JSON schema
    needs: changes
    if: needs.changes.outputs.divi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Divi exports against schema
        run: |
          set -euo pipefail
          python -m pip install --quiet jsonschema
          python scripts/ci/validate_divi_json.py
